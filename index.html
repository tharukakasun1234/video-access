
<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Access</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:20px;
 display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at top,#12362d,#07100e 60%);
 font-family:Arial,sans-serif;color:white
}
.container{width:100%;max-width:480px}
.card{
 background:linear-gradient(145deg,#12241f,#09110f);
 border:1px solid #17634d;border-radius:22px;
 padding:28px;box-shadow:0 15px 60px #0009
}
.logo{text-align:center;font-size:43px;color:#00e5ae}
h1{text-align:center;color:#00e5ae;font-size:26px;margin:10px 0}
.subtitle{text-align:center;color:#8ba99d;font-size:12px;margin-bottom:25px}
.section{
 background:#10231c;border:1px solid #285344;
 padding:20px;border-radius:15px;margin-top:16px
}
label{display:block;color:#a9d5c4;font-size:13px;margin:13px 0 7px}
input{
 width:100%;padding:14px;border-radius:9px;
 background:#091510;border:1px solid #315a49;
 color:white;font-size:14px
}
button{
 width:100%;padding:15px;margin-top:13px;
 border:0;border-radius:10px;
 background:linear-gradient(90deg,#00c997,#00e5ae);
 color:#00251a;font-weight:bold;font-size:15px;cursor:pointer
}
button:disabled{background:#34443d;color:#a0b0a8;cursor:not-allowed}
.timer{text-align:center;font-size:48px;font-weight:bold;color:#00e5ae;margin:15px}
.bar{height:7px;background:#30483d;border-radius:10px;overflow:hidden}
.fill{height:100%;width:0;background:#00e5ae;transition:width .15s}
.status{text-align:center;color:#a5c6b7;font-size:13px;line-height:1.7}
.warning{
 display:none;background:#421b20;border:1px solid #ff586a;
 padding:18px;border-radius:12px;text-align:center;
 color:#ffb0b9;margin-top:15px;line-height:1.7
}
.output{display:none;overflow-wrap:anywhere;color:#9df5d0;font-size:12px;margin-top:15px}
.small{text-align:center;color:#69877b;font-size:11px;margin-top:22px}
</style>
</head>
<body>
<div class="container">
<div class="card">
<div class="logo">▶</div>
<h1>VIDEO ACCESS</h1>
<div class="subtitle">PREMIUM VIDEO GATEWAY</div>
<div id="app"></div>
<div class="small">VIDEO ACCESS SYSTEM ❤️</div>
</div>
</div>

<script>
const app=document.getElementById('app');
const params=new URLSearchParams(location.search);
const video=params.get('video');
const ad=params.get('ad');

function validURL(s){
 try{
  const u=new URL(s);
  return ['https:','http:'].includes(u.protocol)?u.href:null;
 }catch(e){return null}
}

function showGenerator(){
 app.innerHTML=`
 <div class="section">
 <h3 style="text-align:center;color:#00e5ae">LINK GENERATOR</h3>
 <p class="status">ඔබගේ වීඩියෝ Link එක සාදාගන්න</p>
 <label>වීඩියෝ Link එක</label>
 <input id="video" placeholder="https://example.com/video">
 <label>දැන්වීම් Link එක</label>
 <input id="ad" placeholder="https://example.com/ad">
 <button id="generate">LINK එක සාදන්න ↗</button>
 <div class="output" id="output">
 <p>ඔබගේ Link එක:</p>
 <div id="link"></div>
 <button id="copy">COPY LINK</button>
 </div>
 </div>`;

 document.getElementById('generate').onclick=()=>{
  const v=validURL(document.getElementById('video').value.trim());
  const a=validURL(document.getElementById('ad').value.trim());

  if(!v||!a){
   showMessage('කරුණාකර නිවැරදි Video සහ Ad Links ඇතුළත් කරන්න.');
   return;
  }

  const u=new URL(location.href);
  u.search='';
  u.hash='';
  u.searchParams.set('video',v);
  u.searchParams.set('ad',a);

  document.getElementById('link').textContent=u.href;
  document.getElementById('output').style.display='block';

  document.getElementById('copy').onclick=async()=>{
   try{
    await navigator.clipboard.writeText(u.href);
    document.getElementById('copy').textContent='COPY කළා ✓';
   }catch(e){
    showMessage('Link එක Copy කරන්න පහත Link එක භාවිතා කරන්න.');
   }
  };
 };
}

function showMessage(message){
 const warning=document.getElementById('warning');
 if(warning){
  warning.innerHTML='<strong>⚠️ අවවාදයයි!</strong><br>'+message;
  warning.style.display='block';
 }
}

function showGate(v,a){
 app.innerHTML=`
 <div class="section">
 <h3 style="text-align:center">පියවර 01 — දැන්වීම් Link එක</h3>
 <p class="status">පහත Button එක Click කර අලුත් Tab එකක දැන්වීම් Link එක විවෘත කරන්න.</p>
 <button id="open">AD LINK එක විවෘත කරන්න ↗</button>
 </div>

 <div class="section">
 <h3 style="text-align:center">වීඩියෝව Unlock කිරීම</h3>
 <div class="timer" id="timer">05</div>
 <div class="bar"><div class="fill" id="fill"></div></div>
 <p class="status" id="status">AD Link එක විවෘත කළ පසු තත්පර 5 ගණනය වීම ආරම්භ වේ.</p>
 <button id="unlock" disabled>🔒 වීඩියෝව Unlock කරන්න</button>
 <div class="warning" id="warning">
 <strong>⚠️ අවවාදයයි!</strong><br>
 තත්පර 5 සම්පූර්ණ වීමට පෙර ඔබ නැවත පැමිණ ඇත.<br>
 නැවත AD Link එක විවෘත කර තත්පර 5ක් රැඳී සිටින්න.
 </div>
 </div>`;

 let started=0;
 let done=false;
 let hasLeftPage=false;
 let interval=null;

 const timer=document.getElementById('timer');
 const fill=document.getElementById('fill');
 const status=document.getElementById('status');
 const warning=document.getElementById('warning');
 const unlock=document.getElementById('unlock');
 const open=document.getElementById('open');

 function resetTimer(){
  clearInterval(interval);
  started=0;
  hasLeftPage=false;
  timer.textContent='05';
  fill.style.width='0%';
  unlock.disabled=true;
  unlock.textContent='🔒 වීඩියෝව Unlock කරන්න';
  open.disabled=false;
  open.textContent='AD LINK එක නැවත විවෘත කරන්න ↗';
  status.textContent='නැවත AD Link එක විවෘත කර තත්පර 5ක් රැඳී සිටින්න.';
 }

 function finishTimer(){
  if(done)return;

  done=true;
  clearInterval(interval);
  timer.textContent='✓';
  fill.style.width='100%';
  status.textContent='තත්පර 5 සම්පූර්ණයි! දැන් වීඩියෝව නැරඹිය හැකියි.';
  unlock.disabled=false;
  unlock.textContent='▶ වීඩියෝව බලන්න';
  warning.style.display='none';
  open.disabled=true;
 }

 function updateTimer(){
  if(!started||done)return;

  const elapsed=Date.now()-started;
  const remaining=Math.max(0,5000-elapsed);

  timer.textContent=String(Math.ceil(remaining/1000)).padStart(2,'0');
  fill.style.width=Math.min(100,elapsed/50)+'%';

  if(remaining<=0){
   finishTimer();
  }
 }

 function returned(){
  if(!started||done||!hasLeftPage)return;

  const elapsed=Date.now()-started;

  if(elapsed>=5000){
   finishTimer();
  }else{
   resetTimer();
   warning.style.display='block';
   status.textContent='ඔබ තත්පර 5ට පෙර නැවත පැමිණියා. නැවත උත්සාහ කරන්න.';
  }
 }

 open.onclick=()=>{
  if(started||done)return;

  const w=window.open(a,'_blank');

  if(!w){
   showMessage('කරුණාකර Browser Pop-ups සඳහා අවසර ලබාදී නැවත උත්සාහ කරන්න.');
   return;
  }

  try{w.opener=null}catch(e){}

  started=Date.now();
  hasLeftPage=true;

  warning.style.display='none';
  status.textContent='කරුණාකර තත්පර 5ක් රැඳී සිටින්න...';
  open.disabled=true;
  open.textContent='AD LINK එක විවෘත කළා ✓';

  interval=setInterval(updateTimer,100);
 };

 window.addEventListener('focus',returned);

 document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
   returned();
  }
 });

 unlock.onclick=()=>{
  if(done){
   location.href=v;
  }
 };
}

const v=validURL(video||'');
const a=validURL(ad||'');

if(v&&a){
 showGate(v,a);
}else{
 showGenerator();
}
</script>
</body>
</html>
