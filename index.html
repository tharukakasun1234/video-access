
<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Access</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:20px;
 display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at top,#12362d,#07100e 60%);
 font-family:Arial,sans-serif;color:white
}
.container{width:100%;max-width:480px}
.card{
 background:linear-gradient(145deg,#12241f,#09110f);
 border:1px solid #17634d;border-radius:22px;
 padding:28px;box-shadow:0 15px 60px #0009
}
.logo{text-align:center;font-size:43px;color:#00e5ae}
h1{text-align:center;color:#00e5ae;font-size:26px;margin:10px 0}
.subtitle{text-align:center;color:#8ba99d;font-size:12px;margin-bottom:25px}
.section{
 background:#10231c;border:1px solid #285344;
 padding:20px;border-radius:15px;margin-top:16px
}
label{display:block;color:#a9d5c4;font-size:13px;margin:13px 0 7px}
input{
 width:100%;padding:14px;border-radius:9px;
 background:#091510;border:1px solid #315a49;
 color:white;font-size:14px
}
button{
 width:100%;padding:15px;margin-top:13px;
 border:0;border-radius:10px;
 background:linear-gradient(90deg,#00c997,#00e5ae);
 color:#00251a;font-weight:bold;font-size:15px;cursor:pointer
}
button:disabled{background:#34443d;color:#a0b0a8;cursor:not-allowed}
.timer{text-align:center;font-size:48px;font-weight:bold;color:#00e5ae;margin:15px}
.bar{height:7px;background:#30483d;border-radius:10px;overflow:hidden}
.fill{height:100%;width:0;background:#00e5ae;transition:width .15s}
.status{text-align:center;color:#a5c6b7;font-size:13px;line-height:1.7}
.warning{
 display:none;background:#421b20;border:1px solid #ff586a;
 padding:18px;border-radius:12px;text-align:center;
 color:#ffb0b9;margin-top:15px;line-height:1.7
}
.output{display:none;overflow-wrap:anywhere;color:#9df5d0;font-size:12px;margin-top:15px}
.small{text-align:center;color:#69877b;font-size:11px;margin-top:22px}
.modal-bg{
 display:none;position:fixed;inset:0;background:#000c;
 align-items:center;justify-content:center;padding:20px;z-index:9999
}
.modal{
 width:100%;max-width:360px;background:#14231d;
 border:1px solid #ff586a;border-radius:18px;
 padding:25px;text-align:center;box-shadow:0 15px 50px #000b
}
.modal h2{color:#ff7583;font-size:21px}
.modal p{color:#f3c2c7;line-height:1.7;font-size:14px}
.modal button{margin-top:12px}
</style>
</head>

<body>
<div class="container">
 <div class="card">
  <div class="logo">▶</div>
  <h1>VIDEO ACCESS</h1>
  <div class="subtitle">PREMIUM VIDEO GATEWAY</div>
  <div id="app"></div>
  <div class="small">VIDEO ACCESS SYSTEM ❤️</div>
 </div>
</div>

<div class="modal-bg" id="modalBg">
 <div class="modal">
  <h2>⚠️ අවවාදයයි!</h2>
  <p id="modalMessage"></p>
  <button id="modalClose">හරි</button>
 </div>
</div>

<script>
(() => {
'use strict';

const app = document.getElementById('app');
const modalBg = document.getElementById('modalBg');
const modalMessage = document.getElementById('modalMessage');
const modalClose = document.getElementById('modalClose');

const params = new URLSearchParams(location.search);
const video = params.get('video');
const ad = params.get('ad');

const STORAGE_KEY = 'video_access_state_v5';
const WAIT_TIME = 5000;

let timerInterval = null;
let adStartedAt = 0;
let adOpened = false;
let completed = false;
let hasLeftPage = false;
let warningShown = false;

function showModal(message) {
  modalMessage.textContent = message;
  modalBg.style.display = 'flex';
}

modalClose.addEventListener('click', () => {
  modalBg.style.display = 'none';
});

function validURL(value) {
  try {
    const url = new URL(value);
    return ['https:', 'http:'].includes(url.protocol) ? url.href : null;
  } catch (e) {
    return null;
  }
}

function saveState() {
  try {
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
      startedAt: adStartedAt,
      opened: adOpened,
      completed: completed
    }));
  } catch (e) {}
}

function loadState() {
  try {
    const saved = sessionStorage.getItem(STORAGE_KEY);
    if (!saved) return false;

    const data = JSON.parse(saved);
    if (!data || !data.startedAt) return false;

    adStartedAt = data.startedAt;
    adOpened = !!data.opened;
    completed = !!data.completed;

    return true;
  } catch (e) {
    return false;
  }
}

function clearState() {
  try {
    sessionStorage.removeItem(STORAGE_KEY);
  } catch (e) {}
}

function showGenerator() {
  app.innerHTML = `
  <div class="section">
    <h3 style="text-align:center;color:#00e5ae">LINK GENERATOR</h3>
    <p class="status">ඔබගේ වීඩියෝ Link එක සාදාගන්න</p>

    <label>වීඩියෝ Link එක</label>
    <input id="videoInput" placeholder="https://example.com/video">

    <label>දැන්වීම් Link එක</label>
    <input id="adInput" placeholder="https://example.com/ad">

    <button id="generate">LINK එක සාදන්න ↗</button>

    <div class="output" id="output">
      <p>ඔබගේ Link එක:</p>
      <div id="generatedLink"></div>
      <button id="copy">COPY LINK</button>
    </div>
  </div>`;

  document.getElementById('generate').onclick = () => {
    const v = validURL(document.getElementById('videoInput').value.trim());
    const a = validURL(document.getElementById('adInput').value.trim());

    if (!v || !a) {
      showModal('කරුණාකර නිවැරදි Video සහ Ad Links ඇතුළත් කරන්න.');
      return;
    }

    const url = new URL(location.href);
    url.search = '';
    url.hash = '';
    url.searchParams.set('video', v);
    url.searchParams.set('ad', a);

    document.getElementById('generatedLink').textContent = url.href;
    document.getElementById('output').style.display = 'block';

    document.getElementById('copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(url.href);
        document.getElementById('copy').textContent = 'COPY කළා ✓';
      } catch (e) {
        showModal('Link එක දිගට ඔබා Copy තෝරන්න.');
      }
    };
  };
}

function showGate(v, a) {
  app.innerHTML = `
  <div class="section">
    <h3 style="text-align:center">පියවර 01 — දැන්වීම් Link එක</h3>
    <p class="status">පහත Button එක Click කර දැන්වීම් Link එක විවෘත කරන්න.</p>
    <button id="open">AD LINK එක විවෘත කරන්න ↗</button>
  </div>

  <div class="section">
    <h3 style="text-align:center">වීඩියෝව Unlock කිරීම</h3>
    <div class="timer" id="timer">05</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <p class="status" id="status">AD Link එක විවෘත කර තත්පර 5ක් රැඳී සිටින්න.</p>
    <button id="unlock" disabled>🔒 වීඩියෝව Unlock කරන්න</button>
    <div class="warning" id="warning">
      ⚠️ තත්පර 5ට පෙර ඔබ නැවත පැමිණ ඇත.
    </div>
  </div>`;

  const open = document.getElementById('open');
  const unlock = document.getElementById('unlock');
  const timer = document.getElementById('timer');
  const fill = document.getElementById('fill');
  const status = document.getElementById('status');
  const warning = document.getElementById('warning');

  function finish() {
    completed = true;
    clearInterval(timerInterval);

    timer.textContent = '✓';
    fill.style.width = '100%';
    status.textContent = 'තත්පර 5 සම්පූර්ණයි! දැන් වීඩියෝව නැරඹිය හැකියි.';

    unlock.disabled = false;
    unlock.textContent = '▶ වීඩියෝව බලන්න';
    open.disabled = true;
    warning.style.display = 'none';

    saveState();
  }

  function updateTimer() {
    if (!adStartedAt || completed) return;

    const elapsed = Date.now() - adStartedAt;
    const remaining = Math.max(0, WAIT_TIME - elapsed);

    timer.textContent = String(Math.ceil(remaining / 1000)).padStart(2, '0');
    fill.style.width = Math.min(100, elapsed / WAIT_TIME * 100) + '%';

    if (remaining <= 0) {
      status.textContent = 'තත්පර 5 සම්පූර්ණයි! Gateway එකට ආපසු එන්න.';
    }
  }

  function handleReturn() {
    if (!adOpened || !hasLeftPage || warningShown) return;

    hasLeftPage = false;
    warningShown = true;

    const elapsed = Date.now() - adStartedAt;

    if (elapsed >= WAIT_TIME) {
      finish();
    } else {
      clearInterval(timerInterval);

      adStartedAt = 0;
      adOpened = false;
      completed = false;
      clearState();

      timer.textContent = '05';
      fill.style.width = '0%';
      status.textContent = 'නැවත AD Link එක විවෘත කර තත්පර 5ක් රැඳී සිටින්න.';

      open.disabled = false;
      open.textContent = 'AD LINK එක නැවත විවෘත කරන්න ↗';
      unlock.disabled = true;
      unlock.textContent = '🔒 වීඩියෝව Unlock කරන්න';

      warning.style.display = 'block';

      showModal('තත්පර 5 සම්පූර්ණ වීමට පෙර ඔබ නැවත පැමිණ ඇත. නැවත AD Link එක විවෘත කර තත්පර 5ක් රැඳී සිටින්න.');
    }
  }

  open.onclick = () => {
    if (adOpened || completed) return;

    // Open the ad in a separate page from the user's direct click.
    const newPage = window.open(a, '_blank');

    if (!newPage) {
      showModal('Telegram Browser එක වෙනම Page එක විවෘත කිරීම අවහිර කළා. නැවත උත්සාහ කරන්න.');
      return;
    }

    adStartedAt = Date.now();
    adOpened = true;
    hasLeftPage = false;
    warningShown = false;

    saveState();

    open.disabled = true;
    status.textContent = 'Ad Page එකෙන් නැවත පැමිණෙන තෙක් රැඳී සිටින්න.';

    updateTimer();
    timerInterval = setInterval(updateTimer, 250);
  };

  // Detect when the ad page takes focus.
  window.addEventListener('blur', () => {
    if (adOpened && !completed) {
      hasLeftPage = true;
    }
  });

  // Detect when the user returns to the gateway.
  window.addEventListener('focus', handleReturn);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && adOpened) {
      hasLeftPage = true;
    }

    if (document.visibilityState === 'visible') {
      handleReturn();
    }
  });

  window.addEventListener('pageshow', () => {
    if (loadState() && adOpened && !completed) {
      handleReturn();
    }
  });

  unlock.onclick = () => {
    if (!completed) return;
    clearState();
    location.assign(v);
  };
}

const validVideo = validURL(video || '');
const validAd = validURL(ad || '');

if (validVideo && validAd) {
  showGate(validVideo, validAd);
} else {
  showGenerator();
}

})();
</script>
</body>
</html>
