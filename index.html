
<script>
const app = document.getElementById('app');
const params = new URLSearchParams(location.search);
const video = params.get('video');
const ad = params.get('ad');

const STORAGE_KEY = 'video_access_timer_v4';
const WAIT_TIME = 5000;

function validURL(s) {
  try {
    const u = new URL(s);
    return ['https:', 'http:'].includes(u.protocol) ? u.href : null;
  } catch (e) {
    return null;
  }
}

function showModal(message) {
  document.getElementById('modalMessage').textContent = message;
  document.getElementById('modalBg').style.display = 'flex';
}

document.getElementById('modalClose').onclick = () => {
  document.getElementById('modalBg').style.display = 'none';
};

function showGenerator() {
  app.innerHTML = `
  <div class="section">
    <h3 style="text-align:center;color:#00e5ae">LINK GENERATOR</h3>
    <p class="status">ඔබගේ වීඩියෝ Link එක සාදාගන්න</p>
    <label>වීඩියෝ Link එක</label>
    <input id="video" placeholder="https://example.com/video">
    <label>දැන්වීම් Link එක</label>
    <input id="ad" placeholder="https://example.com/ad">
    <button id="generate">LINK එක සාදන්න ↗</button>
    <div class="output" id="output">
      <p>ඔබගේ Link එක:</p>
      <div id="link"></div>
      <button id="copy">COPY LINK</button>
    </div>
  </div>`;

  document.getElementById('generate').onclick = () => {
    const v = validURL(document.getElementById('video').value.trim());
    const a = validURL(document.getElementById('ad').value.trim());

    if (!v || !a) {
      showModal('කරුණාකර නිවැරදි Video සහ Ad Links ඇතුළත් කරන්න.');
      return;
    }

    const u = new URL(location.href);
    u.search = '';
    u.hash = '';
    u.searchParams.set('video', v);
    u.searchParams.set('ad', a);

    document.getElementById('link').textContent = u.href;
    document.getElementById('output').style.display = 'block';

    document.getElementById('copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(u.href);
        document.getElementById('copy').textContent = 'COPY කළා ✓';
      } catch (e) {
        showModal('Link එක Copy කිරීමට එය දිගට ඔබා Copy තෝරන්න.');
      }
    };
  };
}

function showGate(v, a) {
  app.innerHTML = `
  <div class="section">
    <h3 style="text-align:center">පියවර 01 — දැන්වීම් Link එක</h3>
    <p class="status">පහත Button එක Click කර දැන්වීම් Link එක විවෘත කරන්න.</p>
    <button id="open">AD LINK එක විවෘත කරන්න ↗</button>
  </div>

  <div class="section">
    <h3 style="text-align:center">වීඩියෝව Unlock කිරීම</h3>
    <div class="timer" id="timer">05</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <p class="status" id="status">AD Link එක විවෘත කර තත්පර 5ක් රැඳී සිටින්න.</p>
    <button id="unlock" disabled>🔒 වීඩියෝව Unlock කරන්න</button>
    <div class="warning" id="warning">
      ⚠️ තත්පර 5ට පෙර ඔබ නැවත පැමිණ ඇත.
    </div>
  </div>`;

  const timer = document.getElementById('timer');
  const fill = document.getElementById('fill');
  const status = document.getElementById('status');
  const warning = document.getElementById('warning');
  const unlock = document.getElementById('unlock');
  const open = document.getElementById('open');

  let done = false;
  let countdown = null;

  function finish() {
    if (done) return;

    done = true;
    clearInterval(countdown);

    timer.textContent = '✓';
    fill.style.width = '100%';
    status.textContent = 'තත්පර 5 සම්පූර්ණයි! දැන් වීඩියෝව නැරඹිය හැකියි.';

    unlock.disabled = false;
    unlock.textContent = '▶ වීඩියෝව බලන්න';

    open.disabled = true;
    warning.style.display = 'none';
  }

  function resetGate() {
    done = false;
    clearInterval(countdown);

    timer.textContent = '05';
    fill.style.width = '0%';

    status.textContent = 'තත්පර 5ට පෙර ආපසු පැමිණ ඇත. නැවත AD Link එක විවෘත කරන්න.';
    unlock.disabled = true;
    unlock.textContent = '🔒 වීඩියෝව Unlock කරන්න';

    open.disabled = false;
    open.textContent = 'AD LINK එක නැවත විවෘත කරන්න ↗';

    warning.style.display = 'block';
  }

  function updateTimer() {
    let raw;

    try {
      raw = sessionStorage.getItem(STORAGE_KEY);
    } catch (e) {
      return;
    }

    if (!raw) return;

    try {
      const data = JSON.parse(raw);
      if (!data || !data.started) return;

      const elapsed = Date.now() - data.started;
      const remaining = Math.max(0, WAIT_TIME - elapsed);

      timer.textContent = String(Math.ceil(remaining / 1000)).padStart(2, '0');
      fill.style.width = Math.min(100, (elapsed / WAIT_TIME) * 100) + '%';

      if (remaining === 0) {
        status.textContent = 'තත්පර 5 සම්පූර්ණයි. Gateway එකට ආපසු එන්න.';
      }
    } catch (e) {}
  }

  function checkReturn() {
    if (document.visibilityState === 'hidden') return;

    let raw;

    try {
      raw = sessionStorage.getItem(STORAGE_KEY);
    } catch (e) {
      return;
    }

    if (!raw) return;

    let data;

    try {
      data = JSON.parse(raw);
    } catch (e) {
      sessionStorage.removeItem(STORAGE_KEY);
      return;
    }

    if (!data || !data.started) return;

    // Process this return only once.
    sessionStorage.removeItem(STORAGE_KEY);
    clearInterval(countdown);

    const elapsed = Date.now() - data.started;

    if (elapsed >= WAIT_TIME) {
      finish();
    } else {
      resetGate();

      showModal(
        'තත්පර 5 සම්පූර්ණ වීමට පෙර ඔබ නැවත පැමිණ ඇත. නැවත AD Link එක විවෘත කර තත්පර 5ක් රැඳී සිටින්න.'
      );
    }
  }

  open.onclick = () => {
    if (done) return;

    // Open a separate page directly from the user's click.
    // Do NOT replace the current Gateway page.
    const adWindow = window.open('about:blank', '_blank');

    if (!adWindow) {
      showModal(
        'Telegram In-App Browser එකෙන් වෙනම Page එකක් විවෘත කළ නොහැකි විය. Browser එකේ popup අවසරය පරීක්ෂා කරන්න.'
      );
      return;
    }

    try {
      sessionStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({ started: Date.now() })
      );

      adWindow.location.replace(a);

      open.disabled = true;
      status.textContent = 'Ad Page එකෙන් ආපසු පැමිණෙන තෙක් රැඳී සිටින්න.';

      updateTimer();
      countdown = setInterval(updateTimer, 250);

    } catch (e) {
      try { adWindow.close(); } catch (err) {}

      showModal('Ad Page එක විවෘත කිරීමේදී ගැටලුවක් ඇති විය.');
    }
  };

  unlock.onclick = () => {
    if (!done) return;

    try {
      sessionStorage.removeItem(STORAGE_KEY);
    } catch (e) {}

    location.assign(v);
  };

  // Detect returning from another page in the In-App Browser.
  window.addEventListener('focus', checkReturn);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      checkReturn();
    }
  });

  window.addEventListener('pageshow', checkReturn);

  // Handle a reload or restored page.
  checkReturn();
}

const v = validURL(video || '');
const a = validURL(ad || '');

if (v && a) {
  showGate(v, a);
} else {
  showGenerator();
}
</script>
