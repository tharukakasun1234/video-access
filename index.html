
<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071512">
<title>VIDEO ACCESS</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 padding:22px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-family:Arial,sans-serif;
 color:white;
 background:
 radial-gradient(ellipse at 15% 10%,#126451 0%,transparent 45%),
 radial-gradient(ellipse at 90% 90%,#123c58 0%,transparent 45%),
 #050d0c;
}

.container{width:100%;max-width:470px}

.card{
 padding:27px;
 border-radius:28px;
 background:rgba(255,255,255,.075);
 border:1px solid rgba(255,255,255,.18);
 box-shadow:0 20px 70px #0008;
 backdrop-filter:blur(25px);
 -webkit-backdrop-filter:blur(25px);
}

.logo{
 text-align:center;
 font-size:48px;
 color:#65ffe0;
 text-shadow:0 0 25px #00e5ae88;
}

h1{
 text-align:center;
 font-size:27px;
 letter-spacing:3px;
 margin:10px 0;
 color:#b9fff0;
}

.subtitle{
 text-align:center;
 color:#a2c9bd;
 font-size:11px;
 letter-spacing:3px;
 margin-bottom:27px;
}

.section{
 padding:19px;
 margin-top:15px;
 border-radius:20px;
 background:rgba(255,255,255,.065);
 border:1px solid rgba(255,255,255,.14);
 box-shadow:inset 0 1px 1px #ffffff15;
}

label{
 display:block;
 color:#b8e9dc;
 font-size:13px;
 margin:13px 0 7px;
}

input{
 width:100%;
 padding:14px;
 border-radius:12px;
 background:rgba(0,0,0,.28);
 border:1px solid #ffffff25;
 color:white;
 outline:none;
 font-size:14px;
}

input:focus{border-color:#55f4d0}

button{
 width:100%;
 padding:15px;
 margin-top:12px;
 border:1px solid #ffffff30;
 border-radius:14px;
 background:linear-gradient(120deg,#00d9ad,#73ffe0);
 color:#03251d;
 font-weight:bold;
 font-size:14px;
 cursor:pointer;
 transition:.25s;
}

button:not(:disabled):active{transform:scale(.97)}

button:disabled{
 background:rgba(255,255,255,.08);
 color:#80938b;
 border-color:#ffffff12;
 cursor:not-allowed;
}

.status{
 text-align:center;
 font-size:12px;
 line-height:1.7;
 color:#b3d1c7;
 margin:8px 0;
}

.step{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}

.step h3{
 margin:0;
 font-size:15px;
}

.badge{
 padding:6px 10px;
 border-radius:30px;
 font-size:10px;
 background:#ffffff12;
 color:#a6b8b1;
 border:1px solid #ffffff20;
}

.badge.active{
 background:#00d9ad20;
 color:#6dffdf;
 border-color:#00d9ad66;
}

.timer{
 text-align:center;
 font-size:35px;
 font-weight:bold;
 color:#75ffe0;
 margin:10px;
}

.bar{
 height:6px;
 border-radius:20px;
 background:#ffffff18;
 overflow:hidden;
 margin-top:12px;
}

.fill{
 height:100%;
 width:0;
 background:#55f5d2;
 transition:width .2s linear;
}

.output{
 display:none;
 margin-top:15px;
 color:#a5ffe7;
 overflow-wrap:anywhere;
 font-size:12px;
}

.small{
 text-align:center;
 color:#91b6a9;
 font-size:10px;
 margin-top:25px;
 letter-spacing:2px;
}

</style>
</head>

<body>
<div class="container">
<div class="card">

<div class="logo">▶</div>
<h1>VIDEO ACCESS</h1>
<div class="subtitle">PREMIUM VIDEO GATEWAY</div>

<div id="app"></div>

<div class="small">LIQUID GLASS EXPERIENCE ❤️</div>

</div>
</div>

<script>
(() => {
'use strict';

const app=document.getElementById('app');
const params=new URLSearchParams(location.search);

const video=params.get('video');
const ad1=params.get('ad1');
const ad2=params.get('ad2');

const KEY='liquid_video_access_v1';

function validURL(value){
 try{
  const u=new URL(value);
  return ['https:','http:'].includes(u.protocol)?u.href:null;
 }catch(e){return null;}
}

function showMessage(message){
 alert(message);
}

function saveState(state){
 try{
  sessionStorage.setItem(KEY,JSON.stringify(state));
 }catch(e){}
}

function getState(){
 try{
  return JSON.parse(sessionStorage.getItem(KEY)) || {};
 }catch(e){return {};}
}

function showGenerator(){

 app.innerHTML=`
 <div class="section">
  <h3 style="text-align:center;color:#8dffe5">CREATE VIDEO LINK</h3>
  <p class="status">ඔබගේ Video සහ Ad Links ඇතුළත් කරන්න</p>

  <label>VIDEO URL</label>
  <input id="videoInput" placeholder="https://example.com/video">

  <label>ADVERTISEMENT 01 URL</label>
  <input id="ad1Input" placeholder="https://example.com/ad1">

  <label>ADVERTISEMENT 02 URL</label>
  <input id="ad2Input" placeholder="https://example.com/ad2">

  <button id="generate">GENERATE LINK ↗</button>

  <div class="output" id="output">
   <p>YOUR VIDEO LINK</p>
   <div id="result"></div>
   <button id="copy">COPY LINK</button>
  </div>
 </div>`;

 document.getElementById('generate').onclick=()=>{
  const v=validURL(document.getElementById('videoInput').value.trim());
  const a1=validURL(document.getElementById('ad1Input').value.trim());
  const a2=validURL(document.getElementById('ad2Input').value.trim());

  if(!v||!a1||!a2){
   showMessage('කරුණාකර Links තුනම නිවැරදිව ඇතුළත් කරන්න.');
   return;
  }

  const u=new URL(location.href);
  u.search='';
  u.hash='';

  u.searchParams.set('video',v);
  u.searchParams.set('ad1',a1);
  u.searchParams.set('ad2',a2);

  document.getElementById('result').textContent=u.href;
  document.getElementById('output').style.display='block';

  document.getElementById('copy').onclick=async()=>{
   try{
    await navigator.clipboard.writeText(u.href);
    document.getElementById('copy').textContent='COPIED ✓';
   }catch(e){
    showMessage('Link එක දිගට ඔබා Copy කරන්න.');
   }
  };
 };
}

function showGate(v,a1,a2){

 let state=getState();

 if(state.link!==location.href){
  state={link:location.href,step:0,started:0};
  saveState(state);
 }

 let step=Number(state.step)||0;
 let started=Number(state.started)||0;

 app.innerHTML=`
 <div class="section">
  <div class="step">
   <h3>01 — ADVERTISEMENT</h3>
   <span class="badge" id="badge1">LOCKED</span>
  </div>
  <button id="adButton1">↗ OPEN AD 01</button>
  <div class="status" id="status1">පළමු දැන්වීම විවෘත කරන්න</div>
  <div class="timer" id="timer1"></div>
  <div class="bar"><div class="fill" id="fill1"></div></div>
 </div>

 <div class="section">
  <div class="step">
   <h3>02 — ADVERTISEMENT</h3>
   <span class="badge" id="badge2">LOCKED</span>
  </div>
  <button id="adButton2" disabled>🔒 OPEN AD 02</button>
  <div class="status" id="status2">පළමු පියවර සම්පූර්ණ කරන්න</div>
  <div class="timer" id="timer2"></div>
  <div class="bar"><div class="fill" id="fill2"></div></div>
 </div>

 <div class="section">
  <div class="step">
   <h3>VIDEO ACCESS</h3>
   <span class="badge" id="badgeVideo">LOCKED</span>
  </div>
  <button id="videoButton" disabled>🔒 WATCH VIDEO</button>
  <p class="status" id="videoStatus">දැන්වීම් දෙකම සම්පූර්ණ කරන්න</p>
 </div>`;

 const b1=document.getElementById('adButton1');
 const b2=document.getElementById('adButton2');
 const bv=document.getElementById('videoButton');

 const t1=document.getElementById('timer1');
 const t2=document.getElementById('timer2');
 const f1=document.getElementById('fill1');
 const f2=document.getElementById('fill2');

 const s1=document.getElementById('status1');
 const s2=document.getElementById('status2');

 let interval=null;

 function store(){
  state.link=location.href;
  state.step=step;
  state.started=started;
  saveState(state);
 }

 function paint(){

  b1.disabled=step!==0;
  b2.disabled=step!==1;
  bv.disabled=step!==2;

  document.getElementById('badge1').textContent=
   step>=1?'COMPLETED':step===0?'READY':'LOCKED';

  document.getElementById('badge1').className=
   'badge '+(step>=1?'active':'');

  document.getElementById('badge2').textContent=
   step>=2?'COMPLETED':step===1?'READY':'LOCKED';

  document.getElementById('badge2').className=
   'badge '+(step>=2?'active':'');

  document.getElementById('badgeVideo').textContent=
   step===2?'UNLOCKED':'LOCKED';

  if(step>=1){
   b1.textContent='✓ AD 01 COMPLETED';
   t1.textContent='✓';
   f1.style.width='100%';
   s1.textContent='පළමු දැන්වීම සම්පූර්ණයි';
  }

  if(step>=2){
   b2.textContent='✓ AD 02 COMPLETED';
   t2.textContent='✓';
   f2.style.width='100%';
   s2.textContent='දෙවැනි දැන්වීම සම්පූර්ණයි';
   bv.textContent='▶ WATCH VIDEO';
   document.getElementById('videoStatus').textContent=
    'ඔබගේ වීඩියෝව දැන් නැරඹිය හැකියි!';
  }
 }

 function startCountdown(){

  clearInterval(interval);

  function tick(){

   const elapsed=Date.now()-started;
   const remaining=Math.max(0,5000-elapsed);
   const seconds=Math.ceil(remaining/1000);

   const timer=step===0?t1:t2;
   const fill=step===0?f1:f2;
   const status=step===0?s1:s2;

   timer.textContent=String(seconds).padStart(2,'0');
   fill.style.width=Math.min(100,elapsed/5000*100)+'%';

   if(remaining<=0){
    clearInterval(interval);

    step++;
    started=0;
    store();
    paint();

    if(step===1){
     b2.disabled=false;
     s2.textContent='දැන් දෙවැනි දැන්වීම විවෘත කරන්න';
    }

    if(step===2){
     bv.disabled=false;
     document.getElementById('videoStatus').textContent=
      'දැන් වීඩියෝව නැරඹිය හැකියි!';
    }
   }else{
    status.textContent='කරුණාකර තත්පර 5ක් රැඳී සිටින්න.';
   }
  }

  tick();
  interval=setInterval(tick,200);
 }

 function openAd(url){

  if(started||step>=2)return;

  // Direct user-click opens the ad in a separate page.
  const page=window.open(url,'_blank');

  if(!page){
   showMessage('Telegram Browser එක Page එක විවෘත කිරීම අවහිර කළා. නැවත උත්සාහ කරන්න.');
   return;
  }

  started=Date.now();
  store();

  if(step===0){
   b1.disabled=true;
   s1.textContent='පළමු දැන්වීම විවෘත කර ඇත.';
  }else{
   b2.disabled=true;
   s2.textContent='දෙවැනි දැන්වීම විවෘත කර ඇත.';
  }

  startCountdown();
 }

 b1.onclick=()=>openAd(a1);
 b2.onclick=()=>openAd(a2);

 bv.onclick=()=>{
  if(step===2){
   location.assign(v);
  }
 };

 paint();

 // Restore an active countdown after a page refresh.
 if(started && step<2){
  const elapsed=Date.now()-started;

  if(elapsed>=5000){
   step++;
   started=0;
   store();
   paint();
  }else{
   if(step===0)b1.disabled=true;
   if(step===1)b2.disabled=true;
   startCountdown();
  }
 }
}

const v=validURL(video||'');
const a1=validURL(ad1||'');
const a2=validURL(ad2||'');

if(v&&a1&&a2){
 showGate(v,a1,a2);
}else{
 showGenerator();
}

})();
</script>
</body>
</html>
