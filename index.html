
<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>වීඩියෝ පිවිසුම</title>

<style>
*{box-sizing:border-box}
:root{--glass:rgba(255,255,255,.09);--line:rgba(255,255,255,.2)}
body{
 margin:0;min-height:100vh;min-height:100dvh;overflow:hidden;
 display:flex;align-items:center;justify-content:center;
 padding:14px;color:#fff;
 font-family:Arial,"Noto Sans Sinhala",sans-serif;
 background:
 radial-gradient(ellipse at 15% 15%,#147b68 0%,transparent 42%),
 radial-gradient(ellipse at 85% 85%,#183b80 0%,transparent 45%),
 linear-gradient(135deg,#071b20,#10152c 65%,#071b20);
}
body:before,body:after{
 content:"";position:fixed;width:230px;height:230px;border-radius:50%;
 filter:blur(65px);opacity:.35;pointer-events:none;
}
body:before{background:#00e5ae;top:-90px;right:-70px}
body:after{background:#477dff;bottom:-100px;left:-80px}
.container{
 width:100%;max-width:420px;position:relative;z-index:1;
 padding:25px 21px;border:1px solid var(--line);
 border-radius:30px;background:rgba(255,255,255,.075);
 backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
 box-shadow:0 20px 65px #0007,inset 0 1px 1px #ffffff30;
 text-align:center;
}
.logo{
 width:58px;height:58px;margin:0 auto 12px;border-radius:20px;
 display:grid;place-items:center;font-size:27px;
 background:linear-gradient(145deg,#ffffff35,#ffffff08);
 border:1px solid #ffffff35;
 box-shadow:inset 0 1px 8px #ffffff25,0 8px 25px #0003;
}
h1{font-size:23px;margin:5px 0 8px;font-weight:750}
.sub{font-size:13px;color:#c4d7d7;margin:0 0 20px;line-height:1.7}
.glass-input{
 width:100%;padding:14px;margin:7px 0;border-radius:15px;
 border:1px solid #ffffff25;background:#ffffff0c;
 color:white;outline:none;font-size:14px;
}
.glass-input::placeholder{color:#b8caca}
.glass-input:focus{border-color:#00e5ae;box-shadow:0 0 0 3px #00e5ae20}
.btn{
 width:100%;padding:15px 12px;margin:7px 0;border-radius:17px;
 border:1px solid #ffffff35;color:white;font-size:15px;
 font-weight:700;cursor:pointer;
 background:linear-gradient(135deg,#ffffff25,#ffffff09);
 box-shadow:inset 0 1px 1px #ffffff35,0 8px 20px #0003;
 backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
 transition:.2s;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.ad-btn{background:linear-gradient(120deg,#00b99455,#00e5ae18)}
.video-btn{
 background:linear-gradient(120deg,#00d6a1,#008f86);
 border-color:#ffffff55;color:#041d19;
 box-shadow:0 7px 25px #00d6a144,inset 0 1px 2px #ffffff80;
}
.status{
 min-height:37px;margin:12px 0 3px;padding:9px;
 border-radius:13px;background:#ffffff0b;
 color:#d6e9e7;font-size:12px;line-height:1.6;
}
.countdown{
 font-size:14px;font-weight:bold;color:#65ffcf;
 margin:10px 0;min-height:20px;
}
.progress{
 height:5px;background:#ffffff18;border-radius:20px;
 overflow:hidden;margin:8px 0 12px;
}
.progress span{
 display:block;height:100%;width:0%;
 background:linear-gradient(90deg,#00e5ae,#8affdc);
 border-radius:20px;transition:width .2s;
}
.footer{font-size:10px;color:#8ca8a7;margin-top:15px}
.hidden{display:none!important}
@media(max-height:700px){
 .container{padding:17px 18px;border-radius:25px}
 .logo{width:45px;height:45px;font-size:22px;margin-bottom:7px}
 h1{font-size:20px;margin:3px 0 5px}
 .sub{margin-bottom:11px;font-size:12px}
 .btn{padding:12px;margin:5px 0}
 .glass-input{padding:11px;margin:5px 0}
 .status{margin:7px 0 2px}
 .footer{margin-top:9px}
}
</style>
</head>

<body>
<div class="container">
 <div class="logo">▶</div>
 <h1>වීඩියෝ පිවිසුම</h1>
 <p class="sub" id="subtitle">වීඩියෝවට පිවිසීමට පහත පියවර අනුගමනය කරන්න</p>

 <!-- LINK GENERATOR -->
 <section id="generator" class="hidden">
  <input class="glass-input" id="videoUrl" placeholder="වීඩියෝ සබැඳිය ඇතුළත් කරන්න">
  <input class="glass-input" id="adUrl1" placeholder="පළමු දැන්වීමේ සබැඳිය">
  <input class="glass-input" id="adUrl2" placeholder="දෙවන දැන්වීමේ සබැඳිය">
  <button class="btn video-btn" onclick="generateLink()">සබැඳිය සාදන්න</button>
  <input class="glass-input hidden" id="generatedLink" readonly>
  <button class="btn hidden" id="copyBtn" onclick="copyLink()">සබැඳිය පිටපත් කරන්න</button>
  <div class="status" id="generatorStatus">සබැඳි තුනම ඇතුළත් කරන්න</div>
 </section>

 <!-- VIDEO GATEWAY -->
 <section id="gateway" class="hidden">
  <button class="btn ad-btn" id="adButton1" onclick="openAd(1)">
   පළමු දැන්වීම බලන්න
  </button>

  <div class="countdown" id="countdown1"></div>
  <div class="progress"><span id="progress1"></span></div>

  <button class="btn ad-btn" id="adButton2" onclick="openAd(2)" disabled>
   දෙවන දැන්වීම බලන්න
  </button>

  <div class="countdown" id="countdown2"></div>
  <div class="progress"><span id="progress2"></span></div>

  <button class="btn video-btn" id="videoButton" onclick="openVideo()" disabled>
   වීඩියෝව විවෘත කරන්න
  </button>

  <div class="status" id="status">
   පළමු දැන්වීම විවෘත කර තත්පර 5ක් රැඳී සිටින්න
  </div>
 </section>

 <div class="footer">ආරක්ෂිත පිවිසුම් පිටුව</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const video = params.get("video");
const ad1 = params.get("ad1");
const ad2 = params.get("ad2");

const generator = document.getElementById("generator");
const gateway = document.getElementById("gateway");

function validUrl(value){
 try{
  const u = new URL(value);
  return u.protocol === "https:" || u.protocol === "http:";
 }catch(e){return false}
}

if(video && ad1 && ad2){
 gateway.classList.remove("hidden");
}else{
 generator.classList.remove("hidden");
}

function generateLink(){
 const v=document.getElementById("videoUrl").value.trim();
 const a1=document.getElementById("adUrl1").value.trim();
 const a2=document.getElementById("adUrl2").value.trim();

 if(!validUrl(v)||!validUrl(a1)||!validUrl(a2)){
  document.getElementById("generatorStatus").textContent=
   "කරුණාකර නිවැරදි සබැඳි තුනම ඇතුළත් කරන්න";
  return;
 }

 const link=location.origin+location.pathname+
  "?video="+encodeURIComponent(v)+
  "&ad1="+encodeURIComponent(a1)+
  "&ad2="+encodeURIComponent(a2);

 const output=document.getElementById("generatedLink");
 output.value=link;
 output.classList.remove("hidden");
 document.getElementById("copyBtn").classList.remove("hidden");
 document.getElementById("generatorStatus").textContent="සබැඳිය සාර්ථකව සකස් කළා";
}

function copyLink(){
 const field=document.getElementById("generatedLink");
 field.select();
 field.setSelectionRange(0,99999);
 navigator.clipboard?.writeText(field.value).then(()=>{
  document.getElementById("generatorStatus").textContent="සබැඳිය පිටපත් කළා";
 }).catch(()=>{
  document.execCommand("copy");
  document.getElementById("generatorStatus").textContent="සබැඳිය පිටපත් කළා";
 });
}

const storageKey="video_access_"+location.search;
let saved={};
try{saved=JSON.parse(sessionStorage.getItem(storageKey)||"{}")}catch(e){}
let step=saved.step||0;
let startedAt=saved.startedAt||0;
let active=false;
let ticker=null;

const b1=document.getElementById("adButton1");
const b2=document.getElementById("adButton2");
const bv=document.getElementById("videoButton");
const statusBox=document.getElementById("status");

function save(){
 sessionStorage.setItem(storageKey,JSON.stringify({step,startedAt}));
}

function paint(){
 b1.disabled=step!==0||active;
 b2.disabled=step!==1||active;
 bv.disabled=step!==2;
 if(step===0) statusBox.textContent="පළමු දැන්වීම විවෘත කර තත්පර 5ක් රැඳී සිටින්න";
 if(step===1) statusBox.textContent="දැන් දෙවන දැන්වීම විවෘත කරන්න";
 if(step===2) statusBox.textContent="දැන් ඔබට වීඩියෝව විවෘත කළ හැකියි";
}

function openAd(number){
 if(active || (number===1 && step!==0) || (number===2 && step!==1))return;

 const url=number===1?ad1:ad2;
 if(!validUrl(url))return;

 // Open the advertisement separately from the gateway page.
 const newPage=window.open(url,"_blank");

 if(!newPage){
  statusBox.textContent="දැන්වීම විවෘත කිරීමට අවසර දෙන්න හෝ නැවත උත්සාහ කරන්න";
  return;
 }

 active=true;
 startedAt=Date.now();
 save();
 runCountdown(number);
}

function runCountdown(number){
 clearInterval(ticker);
 const count=document.getElementById("countdown"+number);
 const bar=document.getElementById("progress"+number);

 function update(){
  const elapsed=(Date.now()-startedAt)/1000;
  const remaining=Math.max(0,5-elapsed);
  count.textContent="5 Second Countdown · "+Math.ceil(remaining)+"s";
  bar.style.width=Math.min(100,elapsed/5*100)+"%";

  if(remaining<=0){
   clearInterval(ticker);
   active=false;
   step++;
   startedAt=0;
   save();
   count.textContent="සම්පූර්ණයි ✓";
   bar.style.width="100%";
   paint();
  }
 }

 update();
 ticker=setInterval(update,150);
}

document.addEventListener("visibilitychange",()=>{
 if(!document.hidden && active){
  const number=step+1;
  runCountdown(number);
 }
});

window.addEventListener("pageshow",()=>{
 if(active)runCountdown(step+1);
});

function openVideo(){
 if(step!==2 || !validUrl(video))return;
 location.href=video;
}

if(video && ad1 && ad2){
 paint();
 if(active && startedAt)runCountdown(step+1);
}
</script>
</body>
</html>
